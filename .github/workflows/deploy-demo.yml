name: 部署 Demo 到 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Demo
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: 安装依赖
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: 构建 Demo
        run: yarn build:demo

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 GitHub Pages 构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

  deploy:
    name: 发布 Demo
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
